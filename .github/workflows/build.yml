name: Build MAHDI XP PS4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenOrbis
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make

      - name: Check files
        run: |
          ls -la
          echo "Source files checked"
