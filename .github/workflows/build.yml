name: Build MAHDI XP PS4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with OpenOrbis
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: make
