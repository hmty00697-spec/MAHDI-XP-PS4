name: MAHDI XP PS4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test OpenOrbis Toolchain
        run: |
          docker run --rm openorbisofficial/toolchain:latest bash -lc '
            echo "OpenOrbis Toolchain"
            echo "SDK: $OO_PS4_TOOLCHAIN"
            test -d "$OO_PS4_TOOLCHAIN"
            ls "$OO_PS4_TOOLCHAIN/bin/linux"
          '
