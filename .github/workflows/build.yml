name: MAHDI XP PS4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PS4 Game
        run: |
          docker run --rm \
            --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc "set -e; echo 'Starting MAHDI XP PS4 Build'; make"

      - name: Upload Build Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAHDI-XP-PS4-Build
          path: |
            eboot.bin
            build/
          if-no-files-found: warn
