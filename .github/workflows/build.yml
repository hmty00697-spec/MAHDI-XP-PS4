
name: MAHDI XP PS4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Game
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: false

      - name: Checkout create-fself
        uses: actions/checkout@v7
        with:
          repository: OpenOrbis/create-fself
          path: create-fself-source

      - name: Checkout create-gp4
        uses: actions/checkout@v7
        with:
          repository: OpenOrbis/create-gp4
          path: create-gp4-source

      - name: Build Packaging Tools
        run: |
          cd create-fself-source/cmd/create-fself
          go build -modfile=go-linux.mod \
            -o "$GITHUB_WORKSPACE/create-fself" .

          cd "$GITHUB_WORKSPACE/create-gp4-source/cmd/create-gp4"
          go build -o "$GITHUB_WORKSPACE/create-gp4" .

      - name: Download PkgTool
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pkgtool"

          curl -fL \
            https://github.com/maxton/LibOrbisPkg/releases/download/v0.2/PkgTool.Core-linux-x64-0.2.231.zip \
            -o "$GITHUB_WORKSPACE/pkgtool/PkgTool.Core.zip"

          unzip -o \
            "$GITHUB_WORKSPACE/pkgtool/PkgTool.Core.zip" \
            -d "$GITHUB_WORKSPACE/pkgtool"

          test -f "$GITHUB_WORKSPACE/pkgtool/PkgTool.Core"
          chmod +x "$GITHUB_WORKSPACE/pkgtool/PkgTool.Core"

      - name: Build PS4 Game and PKG
        run: |
          docker run --rm \
            --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc "set -e

            SDK=/lib/OpenOrbisSDK
            BIN=\$SDK/bin/linux

            mkdir -p \$BIN

            echo 'Installing tools'
            cp /workspace/create-fself \$BIN/create-fself
            cp /workspace/create-gp4 \$BIN/create-gp4
            cp /workspace/pkgtool/PkgTool.Core \$BIN/PkgTool.Core

            chmod +x \$BIN/create-fself
            chmod +x \$BIN/create-gp4
            chmod +x \$BIN/PkgTool.Core

            export PATH=\$BIN:\$PATH

            echo 'Checking tools'
            command -v create-gp4
            command -v PkgTool.Core

            echo 'Building MAHDI XP'
            make

            test -f eboot.bin
            test -f sce_sys/icon0.png

            echo 'Creating param.sfo'
            PkgTool.Core sfo_new sce_sys/param.sfo

            PkgTool.Core sfo_setentry --type Integer --maxsize 4 --value 1 sce_sys/param.sfo APP_TYPE
            PkgTool.Core sfo_setentry --type Utf8 --maxsize 8 --value '1.00' sce_sys/param.sfo APP_VER
            PkgTool.Core sfo_setentry --type Integer --maxsize 4 --value 0 sce_sys/param.sfo ATTRIBUTE
            PkgTool.Core sfo_setentry --type Utf8 --maxsize 4 --value 'gd' sce_sys/param.sfo CATEGORY
            PkgTool.Core sfo_setentry --type Utf8 --maxsize 48 --value 'IV0000-MHDI00001_00-MAHDIXP000000000' sce_sys/param.sfo CONTENT_ID
            PkgTool.Core sfo_setentry --type Integer --maxsize 4 --value 0 sce_sys/param.sfo DOWNLOAD_DATA_SIZE
            PkgTool.Core sfo_setentry --type Integer --maxsize 4 --value 0 sce_sys/param.sfo SYSTEM_VER
            PkgTool.Core sfo_setentry --type Utf8 --maxsize 128 --value 'MAHDI XP' sce_sys/param.sfo TITLE
            PkgTool.Core sfo_setentry --type Utf8 --maxsize 12 --value 'MHDI00001' sce_sys/param.sfo TITLE_ID
            PkgTool.Core sfo_setentry --type Utf8 --maxsize 8 --value '1.00' sce_sys/param.sfo VERSION

            echo 'Inspecting PARAM.SFO'
            PkgTool.Core sfo_listentries sce_sys/param.sfo

            echo 'Creating GP4'
            create-gp4 \
              -out=pkg.gp4 \
              --content-id=IV0000-MHDI00001_00-MAHDIXP000000000 \
              --files 'eboot.bin sce_sys/param.sfo sce_sys/icon0.png'

            test -f pkg.gp4

            echo 'Building PKG'
            PkgTool.Core pkg_build pkg.gp4 .

            echo 'Checking output'
            ls -lh *.pkg

            PKG_FILE=\$(find . -maxdepth 1 -type f -name '*.pkg' -print -quit)
            test -n \"\$PKG_FILE\"

            echo 'Listing PKG entries'
            PkgTool.Core pkg_listentries \"\$PKG_FILE\"

            echo 'Validating PKG hashes and signatures'
            PkgTool.Core pkg_validate --verbose \"\$PKG_FILE\"
            "

      - name: Upload PS4 Package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MAHDI-XP-PS4-PKG
          path: |
            *.pkg
            eboot.bin
            pkg.gp4
            sce_sys/param.sfo
          if-no-files-found: error
